name: OKF Quality Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'okf/**/*.md'
  pull_request:
    paths:
      - 'okf/**/*.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pyyaml
      - name: OKF Lint (CI gate)
        run: python scripts/okf_lint.py

  analyse:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pyyaml
      - name: OKF Analyse (report only)
        run: python scripts/okf_analyse.py --output reports/
      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: okf-analysis
          path: reports/
      - name: Comment PR with summary
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: reports/okf-analysis-summary.md
